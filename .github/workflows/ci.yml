name: Entrevecinos CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entrevecinos_pilot_test
          POSTGRES_PASSWORD: pruebas-ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pilot
        env:
          PILOT_TEST_DATABASE_URL: postgresql://postgres:pruebas-ci@127.0.0.1:5432/entrevecinos_pilot_test
          BROWSER_NO_SANDBOX: '1'
      - run: npm run test:e2e
        env:
          BROWSER_NO_SANDBOX: '1'
